<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coudre avec la LS-1217</title>
<meta name="theme-color" content="#E9ECE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Guide pas à pas pour débuter sur la machine à coudre Brother LS-1217, même sans jamais avoir cousu.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LS-1217">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE7; --surface:#F8F9F6; --ink:#1D2628; --muted:#5A6669; --line:#CDD3CD;
  --teal:#2E6F73; --teal-soft:#D3E4E2; --thread:#D33B2F; --bob:#2F67C9; --tape:#EDB425;
  --machine:#FCFCF9; --machine-shade:#E3E6E0; --metal:#AEB6B6; --fabric:#E6D8BF; --ok:#2E8A57;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A1B; --surface:#1E2627; --ink:#E9EDE9; --muted:#9BA7A7; --line:#33403F;
    --teal:#68B0B3; --teal-soft:#21393A; --thread:#FF6A5C; --bob:#7EA8FF; --tape:#F3C443;
    --machine:#2A3334; --machine-shade:#222A2B; --metal:#5E6A6A; --fabric:#4E4536; --ok:#5BC489;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1B; --surface:#1E2627; --ink:#E9EDE9; --muted:#9BA7A7; --line:#33403F;
  --teal:#68B0B3; --teal-soft:#21393A; --thread:#FF6A5C; --bob:#7EA8FF; --tape:#F3C443;
  --machine:#2A3334; --machine-shade:#222A2B; --metal:#5E6A6A; --fabric:#4E4536; --ok:#5BC489;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:8px;padding:10px 16px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;white-space:nowrap;background:none;border:0;padding:4px 0}
.chips{flex:1;display:flex;gap:3px;min-width:0;padding:0 6px}
.chips i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.chips i.done{background:var(--thread)}
.chips i.now{background:var(--ink)}
.pill{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px;white-space:nowrap}

main{max-width:560px;margin:0 auto;padding:0 16px 130px}

/* home */
.hero h1{font-size:clamp(40px,11vw,60px);line-height:.95;font-weight:800;margin:16px 0 12px}
.lead{font-size:19px;color:var(--muted);margin:0 0 8px}
.chapters{list-style:none;padding:0;margin:22px 0 0;position:relative}
.chapters::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;border-left:3px dashed var(--thread)}
.chapters button{width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:8px 0}
.chapters b{flex:none;width:41px;height:41px;border-radius:50%;background:var(--surface);border:3px solid var(--thread);display:grid;place-items:center;z-index:1;font-size:15px}
.chapters .ok b{background:var(--thread);color:#fff}
.chapters span{font-weight:700;line-height:1.25}
.chapters small{display:block;color:var(--muted);font-weight:400;font-size:15px}

/* screen */
.kicker{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);width:20px;border-radius:4px}
.dots i.past{background:var(--teal)}
.stage{background:var(--surface);border-radius:22px;padding:12px 8px 8px;position:relative;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.replay{position:absolute;right:10px;bottom:10px;border:0;background:var(--thread);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.screen h2{font-size:clamp(28px,7.6vw,38px);line-height:1.02;margin:18px 0 10px;font-weight:800}
.screen p{margin:0 0 12px}
.checks{list-style:none;padding:0;margin:4px 0 12px}
.checks li{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;background:var(--surface);border-radius:14px;padding:10px 12px}
.checks li .ic{flex:none;font-size:18px;line-height:1.4}
.note{margin:12px 0 0;padding:13px 15px;border-radius:16px;display:flex;gap:12px}
.note.tip{background:var(--teal-soft)}
.note.warn{background:color-mix(in srgb,var(--tape) 30%,var(--surface))}
.note .ic{flex:none;font-size:20px;line-height:1.3}
.intro-card{background:var(--surface);border-radius:22px;padding:22px 20px;margin-top:10px}
.intro-card .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--thread)}
.intro-card h2{margin:8px 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.meta span{background:var(--bg);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:700}

/* simulator */
.sim{background:var(--surface);border-radius:18px;padding:14px;margin:0 0 12px}
.sim .row{margin:0 0 12px}
.sim .hint{font-size:15px;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{min-width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.status{font-weight:700;padding:11px 13px;border-radius:12px;background:var(--bg)}
.status.ok{background:var(--ok);color:#fff}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav button{height:56px;border-radius:16px;font-weight:700;font-size:18px;border:0}
.prev{flex:0 0 auto;padding:0 18px;background:var(--surface)}
.prev[hidden]{display:none}
.next{flex:1;background:var(--thread);color:#fff}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;
  max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .3s ease;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:30px;margin:0 0 4px}
.sheet .lead{margin:0 0 14px;font-size:17px}
.reflex{background:var(--thread);color:#fff;border-radius:16px;padding:14px 16px;margin:0 0 16px;font-weight:700}
.reflex span{display:block;font-weight:400}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;padding:14px 0;font-weight:700;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--teal)}
details[open] summary::after{content:"–"}
details p{margin:0 0 14px;color:var(--muted)}
details p b{color:var(--ink)}
.words dt{font-weight:700;margin-top:12px}
.words dd{margin:2px 0 0;color:var(--muted)}
.close{width:100%;margin-top:18px;height:52px;border-radius:14px;border:0;background:var(--ink);color:var(--surface);font-weight:700}
.todo{list-style:none;margin:0;padding:0}
.todo li{margin:0 0 8px}
.todo button{width:100%;text-align:left;display:flex;gap:14px;align-items:center;background:var(--surface);border:0;border-radius:16px;padding:13px 14px}
.todo .box{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.todo button[aria-pressed="true"]{opacity:.55}
.todo button[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:#fff}

/* svg */
.m-body{fill:var(--machine);stroke:var(--ink);stroke-width:2}
.m-shade{fill:var(--machine-shade)}
.m-metal{fill:var(--metal);stroke:var(--ink);stroke-width:1.5}
.m-teal{fill:var(--teal)}
.m-line{stroke:var(--ink);stroke-width:2;fill:none}
.m-thin{stroke:var(--ink);stroke-width:1.2;fill:none}
.m-dial{fill:var(--machine);stroke:var(--ink);stroke-width:2}
.m-label{font:700 9px "Atkinson Hyperlegible",sans-serif;fill:var(--muted)}
.t{font:700 13px "Atkinson Hyperlegible",sans-serif;fill:var(--ink)}
.ts{font:400 12px "Atkinson Hyperlegible",sans-serif;fill:var(--muted)}
.tr{fill:var(--thread)} .tb{fill:var(--bob)} .tok{fill:var(--ok)}
.ln{stroke:var(--ink);stroke-width:1.5;fill:none}
.arr{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;marker-end:url(#ah)}
.arr-t{stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round;marker-end:url(#aht)}
.th{fill:none;stroke:var(--thread);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.thb{fill:none;stroke:var(--bob);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.fab{fill:var(--fabric);stroke:var(--ink);stroke-width:1.5}
.met{fill:var(--metal);stroke:var(--ink);stroke-width:1.5}
.bod{fill:var(--machine);stroke:var(--ink);stroke-width:2}
.seg-old{opacity:.35}
.draw{animation:draw 2.4s ease-in-out forwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mark circle.ring{fill:none;stroke:var(--tape);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
.mark circle.dot{fill:var(--tape);stroke:var(--ink);stroke-width:1.5}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(2);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){
  .mark circle.ring,.spin,.bob{animation:none}
  .draw{animation:none;stroke-dashoffset:0}
  .sheet,.scrim{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="Retour au sommaire">LS-1217</button>
  <div class="chips" id="chips" aria-hidden="true"></div>
  <button class="pill" id="wordsBtn" aria-haspopup="dialog">Mots</button>
  <button class="pill" id="helpBtn" aria-haspopup="dialog">Ça coince ?</button>
</header>
<main id="app" aria-live="polite"></main>
<nav class="nav"><div class="in">
  <button class="prev" id="prev">Retour</button>
  <button class="next" id="next">Commencer</button>
</div></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheetHelp" role="dialog" aria-modal="true" aria-labelledby="hT"><div class="grab"></div><div class="in">
  <h2 id="hT" class="display">Ça coince ?</h2>
  <p class="lead">Choisis ce qui se passe, la solution est dessous.</p>
  <div class="reflex">Le réflexe qui règle la moitié des soucis<span>Éteindre, lever le pied presseur, tout désenfiler et tout réenfiler.</span></div>
  <div id="faq"></div>
  <button class="close">Revenir à mon étape</button>
</div></section>
<section class="sheet" id="sheetWords" role="dialog" aria-modal="true" aria-labelledby="wT"><div class="grab"></div><div class="in">
  <h2 id="wT" class="display">Les mots de la couture</h2>
  <p class="lead">Les termes utilisés dans le guide, en clair.</p>
  <dl class="words" id="words"></dl>
  <button class="close">Revenir à mon étape</button>
</div></section>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--teal)"/></marker>
    <symbol id="machine" viewBox="0 0 360 230">
      <!-- bed -->
      <rect class="m-body" x="12" y="172" width="336" height="42" rx="10"/>
      <rect class="m-shade" x="14" y="200" width="332" height="12" rx="6"/>
      <!-- accessory box / bobbin door -->
      <rect class="m-thin" x="18" y="180" width="62" height="28" rx="5"/>
      <rect class="m-thin" x="48" y="184" width="28" height="18" rx="3"/>
      <!-- needle plate -->
      <rect class="m-metal" x="58" y="168" width="44" height="8" rx="2"/>
      <!-- column -->
      <rect class="m-body" x="236" y="46" width="98" height="130" rx="12"/>
      <!-- arm -->
      <path class="m-body" d="M44 46 Q44 34 58 34 H318 Q334 34 334 50 V92 H112 V150 Q112 160 102 160 H54 Q44 160 44 150 Z"/>
      <!-- teal stripe -->
      <rect class="m-teal" x="112" y="86" width="222" height="6"/>
      <!-- logo -->
      <text x="128" y="62" class="m-label" style="font-size:12px;fill:var(--ink)">brother</text>
      <text x="176" y="62" class="m-label" style="font-size:10px">LS-1217</text>
      <!-- head channels -->
      <line class="m-thin" x1="78" y1="48" x2="78" y2="142"/>
      <line class="m-thin" x1="96" y1="48" x2="96" y2="142"/>
      <!-- take-up lever slot -->
      <rect class="m-thin" x="74" y="48" width="8" height="18" rx="3"/>
      <!-- needle bar, needle, foot -->
      <rect class="m-metal" x="66" y="150" width="6" height="12"/>
      <line class="m-line" x1="69" y1="160" x2="69" y2="176"/>
      <path class="m-metal" d="M58 170 h30 l-4 6 h-24 z"/>
      <!-- presser foot lever (back) -->
      <path class="m-line" d="M104 120 q10 2 10 14"/>
      <!-- top: spool pin + spool -->
      <line class="m-line" x1="296" y1="34" x2="296" y2="14"/>
      <rect x="286" y="8" width="20" height="22" rx="3" fill="var(--thread)" stroke="var(--ink)" stroke-width="1.5"/>
      <!-- bobbin winder -->
      <line class="m-line" x1="260" y1="34" x2="260" y2="24"/>
      <circle cx="260" cy="22" r="6" fill="var(--machine)" stroke="var(--ink)" stroke-width="1.5"/>
      <!-- top thread guide & winder tension -->
      <rect class="m-metal" x="110" y="28" width="12" height="6" rx="2"/>
      <circle cx="222" cy="30" r="4" class="m-metal"/>
      <!-- front controls: L M R lever -->
      <rect class="m-thin" x="130" y="102" width="20" height="22" rx="3"/>
      <rect x="134" y="108" width="12" height="12" rx="2" fill="var(--machine-shade)" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="122" y="108" class="m-label">L</text><text x="120" y="117" class="m-label">M</text><text x="122" y="126" class="m-label">R</text>
      <!-- dials -->
      <circle class="m-dial" cx="256" cy="120" r="15"/>
      <circle class="m-thin" cx="256" cy="120" r="9"/>
      <text x="256" y="146" class="m-label" text-anchor="middle">largeur</text>
      <circle class="m-dial" cx="304" cy="120" r="15"/>
      <circle class="m-thin" cx="304" cy="120" r="9"/>
      <text x="304" y="146" class="m-label" text-anchor="middle">longueur</text>
      <!-- reverse lever -->
      <rect x="292" y="152" width="22" height="14" rx="3" fill="var(--machine-shade)" stroke="var(--ink)" stroke-width="1.5"/>
      <!-- handwheel -->
      <rect x="334" y="62" width="14" height="70" rx="6" fill="var(--machine-shade)" stroke="var(--ink)" stroke-width="2"/>
      <line class="m-thin" x1="338" y1="70" x2="338" y2="124"/>
      <line class="m-thin" x1="344" y1="70" x2="344" y2="124"/>
    </symbol>
</defs></svg>
<script>
/* ---------- Illustrations ---------- */
const S=(inner,vb="0 0 320 200",label="Schéma")=>`<svg viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;
const badge=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="11" fill="var(--tape)" stroke="var(--ink)" stroke-width="1.5"/><text x="${x}" y="${y+4.5}" text-anchor="middle" class="t" style="font-size:12px;fill:#1D2628">${n}</text>`;
const pulse=(x,y)=>`<g class="mark"><circle class="ring" cx="${x}" cy="${y}" r="10"/><circle class="dot" cx="${x}" cy="${y}" r="8"/></g>`;

const MARKS={lever:[140,96],width:[256,98],length:[304,98],reverse:[322,159],wheel:[341,56],foot:[118,134],
  spool:[296,2],winder:[260,10],disc:[222,18],door:[62,193],needle:[52,166],plate:[80,186],takeup:[78,44]};
const SEGS={
  top:"M296 30 L296 36 L116 36 L98 44",
  down:"M98 44 L98 134",
  u:"M98 134 Q98 146 87 146 Q76 146 76 134 L76 56",
  take:"M76 56 L72 60 L72 150 L69 158",
  eye:"M69 158 L69 174",
  wind:"M296 30 L296 38 L222 34 L240 26 L254 22"
};
function machine(o={}){
  const marks=(o.marks||[]).map(k=>pulse(...MARKS[k])).join("");
  const segs=(o.segs||[]).map(k=>{
    const cur=k===o.anim;
    return `<path class="th ${cur?"draw":""}" d="${SEGS[k]}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${cur?1:0}"/>`;
  }).join("");
  return S(`<use href="#machine"/>${segs}${marks}`,"0 -10 360 240","Schéma de la machine");
}

const SVG={
lockstitch(){
  let r="M14 84",b="M14 116",loops="";
  [80,160,240].forEach(x=>{r+=` L${x-8} 84 Q${x} 84 ${x} 92 L${x} 100 L${x} 92 Q${x} 84 ${x+8} 84`;b+=` L${x-8} 116 Q${x} 116 ${x} 108 L${x} 100 L${x} 108 Q${x} 116 ${x+8} 116`;
    loops+=`<ellipse cx="${x}" cy="100" rx="6" ry="4" fill="none" stroke="var(--thread)" stroke-width="2.5"/><ellipse cx="${x}" cy="100" rx="3" ry="6" fill="none" stroke="var(--bob)" stroke-width="2.5"/>`;});
  r+=" L306 84"; b+=" L306 116";
  return S(`<rect class="fab" x="10" y="88" width="300" height="24" rx="3"/><line x1="10" y1="100" x2="310" y2="100" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 4"/>
  <path class="th" d="${r}"/><path class="thb" d="${b}"/>${loops}
  <text x="14" y="60" class="t tr">Fil du haut · vient de la bobine</text>
  <text x="14" y="146" class="t tb">Fil du bas · vient de la canette</text>
  <text x="272" y="104" class="ts" style="font-size:11px">tissu</text>
  <path class="arr" d="M200 176 Q170 176 164 108"/><text x="206" y="180" class="ts">ils s'accrochent ici</text>`,"0 30 320 160","Deux fils qui s'accrochent dans le tissu");
},
overview(){
  const L=(x1,y1,x2,y2,tx,ty,txt,anchor="start")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ln"/><circle cx="${x1}" cy="${y1}" r="3" fill="var(--ink)"/><text x="${tx}" y="${ty}" class="t" text-anchor="${anchor}">${txt}</text>`;
  return S(`<use href="#machine"/>
  ${L(296,10,262,-16,258,-20,"Bobine","end")}
  ${L(341,70,352,-14,356,-20,"Volant","end")}
  ${L(76,52,40,-14,6,-20,"Releveur")}

  {svg:()=>SVG.overview(),t:"Les parties à connaître",p:"Pas besoin de tout retenir : chaque élément sera montré au bon moment, avec un point jaune qui clignote. Si un mot t'échappe, appuie sur <b>Mots</b> en haut de l'écran."},
  {svg:()=>SVG.wheel(),t:"La règle n°1 : le volant",p:"La grande roue sur le côté droit fait monter et descendre l'aiguille à la main. Tourne-la <b>toujours vers toi</b> : le haut de la roue vient vers toi.",warn:"Dans l'autre sens, le fil s'emmêle sous la machine."}
 ]},
{key:"reglages",title:"Les réglages",time:"2 min",need:"La machine devant toi",
 intro:"Ta machine n'a pas d'écran : tout se règle avec des molettes et des leviers. On cherche juste le réglage de base, celui qui sert 80 % du temps.",
 screens:[
  {svg:()=>machine({marks:["lever","width","length"]}),sim:true,t:"Trouve le réglage de base",p:"Les 3 points jaunes sont les commandes à régler. Entraîne-toi ici, puis fais pareil sur ta machine."},
  {svg:()=>machine({marks:["reverse"]}),t:"Le levier de marche arrière",p:"C'est le petit levier carré en bas à droite. <b>Tant que tu appuies dessus</b>, la machine coud à reculons. Ça sert à bloquer le fil au début et à la fin d'une couture. On s'en servira au dernier chapitre."}
 ]},
{key:"prep",title:"Préparer la machine",time:"3 min",need:"Une aiguille neuve si possible",
 intro:"Trois vérifications rapides. Elles évitent la plupart des problèmes de débutant.",
 screens:[
  {svg:()=>SVG.power(),t:"Branche, mais laisse éteint",p:"Branche le câble et la pédale. Mets l'interrupteur sur <b>O</b> (éteint) et laisse-le comme ça pendant toute la préparation.",warn:"Machine allumée + pied qui frôle la pédale = l'aiguille pique toute seule."},
  {svg:()=>SVG.needle(),t:"Vérifie l'aiguille",p:"Elle doit être <b>droite</b>, poussée <b>tout en haut</b>, avec le <b>côté plat vers l'arrière</b>. Si elle est tordue ou trop vieille, change-la : desserre la petite vis, retire-la, mets la neuve, resserre.",tip:"Achète des aiguilles « universelles » taille 80 ou 90 (environ 5 € le paquet)."},
  {svg:()=>machine({marks:["wheel","needle"]}),t:"Monte l'aiguille au plus haut",p:"Tourne le volant vers toi jusqu'à ce que l'aiguille soit à son point le plus haut. <b>Tu referas ce geste avant chaque manipulation</b> : canette, enfilage, retrait du tissu."}
 ]},
{key:"bobinage",title:"Remplir la canette",time:"5 min",need:"Une bobine de fil + une canette vide",
 intro:"La canette donne le fil du bas. Vide, elle ne sert à rien : on la remplit avec le fil de ta bobine. La machine fait le travail, toi tu guides.",
 screens:[
  {svg:()=>SVG.spoolPin(),t:"Pose la bobine",p:"Enfile ta bobine de fil sur la tige, sur le dessus de la machine à droite. Si tu as un petit capuchon, mets-le par-dessus pour qu'elle ne saute pas."},
  {svg:()=>SVG.windPath(),t:"Fais passer le fil",p:"Tire le fil vers la gauche et passe-le dans le petit crochet du dessus. Puis fais-lui faire <b>le tour du petit disque</b> en métal. Ce disque serre le fil pour qu'il s'enroule bien. Des flèches gravées sur la machine montrent le chemin."},
  {svg:()=>SVG.bobbinHole(),t:"Accroche le fil à la canette",p:"Prends la canette vide. Passe le bout du fil dans un des petits trous, <b>de l'intérieur vers l'extérieur</b>. Laisse dépasser environ 5 cm."},
  {svg:()=>SVG.winderPush(),t:"Mets la canette sur la tige",p:"Enfonce la canette sur la petite tige à côté de la bobine (l'axe de bobinage). Puis <b>pousse-la vers la droite</b> jusqu'au clic. Normal : l'aiguille ne bougera plus, la machine est en mode remplissage."},
  {svg:()=>SVG.windGo(),t:"Lance le remplissage",p:"Allume la machine. Tiens le bout de fil qui dépasse et appuie <b>doucement</b> sur la pédale. Après une dizaine de tours, arrête, coupe ce bout au ras de la canette, puis reprends."},
  {svg:()=>SVG.windFull(),t:"Arrête quand c'est plein",p:"La canette se remplit en quelques secondes et ralentit quand elle est pleine. Lâche la pédale, <b>repousse la tige vers la gauche</b>, retire la canette et coupe le fil. <b>Éteins la machine.</b>",tip:"Fil serré et régulier = réussi. Fil mou ou en paquet = le fil n'était pas autour du disque : recommence."}
 ]},
{key:"canette",title:"Mettre la canette",time:"5 min",need:"La canette pleine",
 intro:"L'étape qui fait peur, alors on la découpe en 7 petits gestes. La canette va dans une petite boîte en métal, la <b>boîte à canette</b>, cachée sous l'aiguille. Machine éteinte, aiguille en haut.",
 screens:[
  {svg:()=>SVG.accessoryBox(),t:"Enlève le bac à accessoires",p:"C'est le bloc plat à gauche, sous l'aiguille. Tire-le vers la gauche : il se détache. Il reste un bras plus fin."},
  {svg:()=>SVG.openCover(),t:"Ouvre le petit volet",p:"Sur l'avant de ce bras, juste sous l'aiguille, il y a un petit volet. Tire-le vers toi : il s'ouvre vers le bas. Tu vois une pièce ronde en métal : c'est la boîte à canette."},
  {svg:()=>SVG.caseOut(),t:"Sors la boîte à canette",p:"Avec un ongle, soulève la petite languette (le <b>clapet</b>) et tire la boîte vers toi. <b>Tant que tu tiens le clapet</b>, la canette ne peut pas tomber.",tip:"S'il y a déjà une vieille canette dedans, lâche le clapet au-dessus de ta main : elle tombe toute seule."},
  {svg:()=>SVG.bobbinIn(),t:"Pose la canette dans la boîte",p:"Tiens la boîte ouverture vers toi. Mets la canette dedans pour que <b>le fil parte vers la droite</b> en passant par le haut. Si tu tires le fil, la canette tourne dans le sens des aiguilles d'une montre.",warn:"C'est l'erreur la plus courante. Si ta couture fait des nœuds plus tard, reviens ici et retourne la canette."},
  {svg:()=>SVG.slotSpring(),t:"Glisse le fil sous le ressort",p:"<b>1.</b> Fais entrer le fil dans la petite fente du bord. <b>2.</b> Tire-le vers la gauche : il glisse sous la lamelle de métal (le ressort). <b>3.</b> Il ressort par le petit cran au bout. Laisse pendre 10 cm."},
  {svg:()=>SVG.yoyo(),t:"Le test du yo-yo",p:"Tiens juste le bout du fil et laisse la boîte pendre dans le vide. Donne une petite secousse vers le haut.",checks:[["✓","Elle descend un peu puis s'arrête : parfait, continue."],["✗","Elle tombe toute seule : le fil n'est pas sous le ressort, refais l'écran précédent."],["✗","Elle ne bouge pas du tout : le fil est coincé, refais l'écran précédent."]]},
  {svg:()=>SVG.caseIn(),t:"Remets la boîte en place",p:"Tiens le clapet ouvert. La boîte a un petit doigt de métal : place-le <b>en haut</b>, dans l'encoche. Pousse jusqu'au <b>clic</b> et lâche le clapet. Tire doucement : la boîte ne doit pas sortir. Referme le volet et remets le bac.",tip:"Pas de clic ? Tourne un peu la boîte jusqu'à ce que le doigt tombe dans l'encoche."}
 ]},
{key:"enfilage",title:"Enfiler le fil du haut",time:"3 min",need:"La bobine sur sa tige",
 intro:"On fait passer le fil de la bobine jusqu'à l'aiguille. Des flèches gravées sur ta machine montrent le chemin, et le fil rouge du schéma suit le même trajet, morceau par morceau.",
 screens:[
  {svg:()=>SVG.foot(false),t:"Lève le pied presseur",p:"Le levier est derrière l'aiguille. Monte-le : le pied se soulève. <b>Obligatoire</b> : pied baissé, le fil ne se met pas au bon endroit et ta couture fera un paquet de nœuds dessous."},
  {svg:()=>machine({segs:["top"],anim:"top",marks:["spool"]}),replay:true,t:"Le haut",p:"Bobine sur la tige. Tire le fil vers la gauche, sur le dessus de la machine, et passe-le dans le guide-fil."},
  {svg:()=>machine({segs:["top","down"],anim:"down"}),replay:true,t:"Descends à droite",p:"Fais descendre le fil dans la <b>rainure de droite</b>, sur la façade, jusqu'en bas."},
  {svg:()=>machine({segs:["top","down","u"],anim:"u"}),replay:true,t:"Demi-tour et remonte",p:"En bas, fais le tour comme un <b>U</b> et remonte par la <b>rainure de gauche</b>, jusqu'en haut."},
  {svg:()=>machine({segs:["top","down","u","take"],anim:"take",marks:["takeup"]}),replay:true,t:"Le releveur, puis redescends",p:"Tout en haut, une petite pièce en métal avec un trou monte et descend : le <b>releveur</b>. Passe le fil dedans, de droite à gauche. Puis redescends jusqu'à l'aiguille.",tip:"Tu ne vois pas le releveur ? Tourne le volant vers toi : il apparaît quand l'aiguille est tout en haut."},
  {svg:()=>SVG.needleThread(),t:"Enfile l'aiguille",p:"Passe le fil dans le petit crochet juste au-dessus de l'aiguille. Puis dans le trou de l'aiguille, <b>de l'avant vers l'arrière</b>. Tire environ 10 cm de fil vers l'arrière.",tip:"Coupe le bout du fil en biais avec des ciseaux bien nets : il rentre beaucoup plus facilement."}
 ]},
{key:"remonter",title:"Attraper le fil du bas",time:"1 min",need:"Canette en place + fil du haut enfilé",
 intro:"Le fil de la canette est caché sous la plaque. Le fil du haut va aller le chercher. Ça prend 20 secondes.",
 screens:[
  {svg:()=>machine({marks:["wheel"],segs:["top","down","u","take","eye"]}),t:"Un tour de volant",p:"Main gauche : tiens doucement le bout du fil du haut. Main droite : fais faire <b>un tour complet</b> au volant, vers toi. L'aiguille descend, attrape le fil du bas et remonte."},
  {svg:()=>SVG.loopUp(),t:"Tire : une boucle sort",p:"Tire doucement le fil du haut. Une <b>boucle</b> du fil de la canette sort par le trou de la plaque. Attrape-la avec un doigt et tire pour sortir le bout.",tip:"Pas de boucle ? La canette est mal mise (chapitre 5) ou le fil du haut a sauté un passage (chapitre 6)."},
  {svg:()=>SVG.threadsBack(),t:"Les deux fils vers l'arrière",p:"Passe les deux fils <b>sous le pied</b> et tire-les vers l'arrière, environ 10 cm chacun. Ta machine est prête à coudre."}
 ]},
{key:"couture",title:"Ta première couture",time:"10 min",need:"2 chutes de tissu (vieux drap, coton)",
 intro:"On coud une ligne droite sur deux morceaux de tissu. Vas-y lentement : la vitesse viendra toute seule.",
 screens:[
  {svg:()=>SVG.fabricAlign(false),t:"Place le tissu",p:"Pose deux chutes de tissu l'une sur l'autre. Glisse-les sous le pied, le bord du tissu sur la ligne <b>1,5</b> gravée sur la plaque. C'est la distance entre ta couture et le bord."},
  {svg:()=>SVG.foot(true),t:"Pique, puis baisse le pied",p:"Tourne le volant vers toi pour planter l'aiguille dans le tissu. Puis <b>baisse le pied</b> : il tient le tissu en place."},
  {svg:()=>SVG.backstitch(),t:"Le point d'arrêt",p:"Allume. Appuie doucement sur la pédale : 4 points. Puis <b>maintiens le levier de marche arrière</b> : 4 points en arrière. Lâche le levier : tu repars en avant. Ça bloque le fil pour que la couture ne se défasse pas."},
  {svg:()=>SVG.fabricAlign(true),t:"Couds droit",p:"Pédale doucement. Garde le bord du tissu sur la ligne 1,5. Tes mains <b>guident</b> le tissu, elles ne le <b>tirent</b> pas : la machine l'avance toute seule.",warn:"Tirer le tissu tord l'aiguille et la casse."},
  {svg:()=>SVG.backstitch(),t:"Termine proprement",p:"Arrivé au bout : refais un point d'arrêt (4 points en arrière, puis en avant). Remonte l'aiguille avec le volant, <b>lève le pied</b>, tire le tissu vers l'arrière et coupe les fils à 10 cm."},
  {svg:()=>SVG.pivot(),t:"Bonus : tourner un angle",p:"Pour faire un coin : arrête-toi <b>aiguille plantée</b> dans le tissu. Lève le pied, fais pivoter le tissu, rebaisse le pied, repars."}
 ]}
];

const FAQ=[
 ["Un paquet de fil sous le tissu","Le fil du haut a été enfilé <b>pied baissé</b>. Lève le pied et refais le chapitre 6. Vérifie aussi le sens de la canette (chapitre 5)."],
 ["Le fil du haut casse","Enfilage raté ou aiguille abîmée. <b>Réenfile</b>, puis <b>change l'aiguille</b> (côté plat à l'arrière)."],
 ["Des points sautent","Aiguille émoussée ou tordue : <b>change-la</b>."],
 ["L'aiguille casse","Tu tires le tissu, ou elle tape une épingle. <b>Laisse la machine avancer</b> et retire les épingles avant qu'elles passent sous le pied."],
 ["Le tissu n'avance pas","Pied pas baissé, ou longueur sur 0. <b>Baisse le pied</b>, mets la longueur sur <b>2,5</b>."],
 ["La boucle du bas ne sort pas","Refais le <b>test du yo-yo</b> (chapitre 5) et vérifie que la boîte a bien fait clic."],
 ["Le volant tourne, l'aiguille non","La tige de remplissage est restée <b>poussée à droite</b>. Repousse-la à gauche."],
 ["Ça claque ou ça bloque","Fil coincé sous la plaque. <b>Éteins</b>, sors la canette, retire les bouts de fil et les peluches."]
];
const WORDS=[
 ["Bobine","Le gros rouleau de fil posé sur le dessus. Il donne le fil du haut."],
 ["Canette","La petite bobine cachée sous l'aiguille. Elle donne le fil du bas."],
 ["Boîte à canette","La pièce ronde en métal qui tient la canette, avec un clapet et un petit ressort."],
 ["Volant","La grande roue sur le côté droit. Toujours la tourner vers toi."],
 ["Pied presseur","La pièce en métal sous l'aiguille qui appuie sur le tissu. Se lève et se baisse avec un levier."],
 ["Releveur","La petite pièce avec un trou, en haut de la façade, qui monte et descend avec l'aiguille."],
 ["Plaque à aiguille","La plaque en métal sous le pied, avec des lignes gravées pour guider le tissu."],
 ["Point d'arrêt","Quelques points en marche arrière au début et à la fin pour bloquer la couture."],
 ["Marge de couture","La distance entre la couture et le bord du tissu. 1,5 cm le plus souvent."]
];
const EXOS=["Coudre sur une feuille de papier sans fil, en suivant des lignes au crayon","Même chose avec des courbes","Une ligne droite de 30 cm sur tissu, avec points d'arrêt","Un carré, en pivotant aux 4 angles","Du zigzag (largeur 3 à 5) le long d'un bord coupé","Premier vrai projet : une taie d'oreiller ou un tote bag"];

/* ---------- État ---------- */
let st={c:-1,s:-1,done:{},exos:[],sim:{lever:"L",width:"3",length:"4"}};
try{const v=JSON.parse(localStorage.getItem("ls1217v2")||"null");if(v)st=Object.assign(st,v);}catch(e){}
const save=()=>{try{localStorage.setItem("ls1217v2",JSON.stringify(st));}catch(e){}};
const $=id=>document.getElementById(id);
const app=$("app"),prevB=$("prev"),nextB=$("next");

function chips(){ $("chips").innerHTML=CH.map((c,i)=>`<i class="${st.done[c.key]?"done":(i===st.c?"now":"")}"></i>`).join(""); }

function simHTML(){
  const s=st.sim,seg=(k,vals)=>`<div class="seg">${vals.map(v=>`<button data-sim="${k}" data-v="${v}" aria-pressed="${s[k]===v}">${v.replace(".",",")}</button>`).join("")}</div>`;
  const ok=s.lever==="M"&&s.width==="0"&&s.length==="2.5";
  let msg="Point droit classique. C'est bon, fais pareil sur ta machine.";
  if(!ok){ if(s.width!=="0")msg=`Largeur ${s.width} = zigzag. Pour coudre droit, mets la largeur sur 0.`;
    else if(s.lever!=="M")msg=`Aiguille à ${s.lever==="L"?"gauche":"droite"}. Mets le levier sur M (milieu).`;
    else if(s.length==="0")msg="Longueur 0 = la machine pique sur place sans avancer.";
    else msg=`Longueur ${s.length.replace(".",",")} : vise 2,5, entre le 2 et le 3.`; }
  return `<div class="sim"><div class="row"><span class="hint">Levier L · M · R (position de l'aiguille)</span>${seg("lever",["L","M","R"])}</div>
  <div class="row"><span class="hint">Molette du haut : largeur</span>${seg("width",["0","1","2","3","4","5"])}</div>
  <div class="row"><span class="hint">Molette du bas : longueur</span>${seg("length",["0","1","2","2.5","3","4"])}</div>
  <div class="status ${ok?"ok":""}">${msg}</div></div>`;
}

function render(){
  chips(); window.scrollTo(0,0);
  if(st.c<0) return home();
  if(st.c>=CH.length) return end();
  const ch=CH[st.c];
  prevB.hidden=false;
  if(st.s<0){
    app.innerHTML=`<div class="intro-card"><div class="num">${st.c+1}</div><h2 class="display" style="font-size:clamp(30px,8vw,40px)">${ch.title}</h2>
    <p>${ch.intro}</p><div class="meta"><span>⏱ ${ch.time}</span><span>🧰 ${ch.need}</span><span>${ch.screens.length} gestes</span></div></div>`;
    nextB.textContent="C'est parti"; return;
  }
  const sc=ch.screens[st.s];
  const dots=ch.screens.map((_,i)=>`<i class="${i===st.s?"on":(i<st.s?"past":"")}"></i>`).join("");
  app.innerHTML=`<p class="kicker"><span>${st.c+1} · ${ch.title}</span><span class="dots" aria-label="Geste ${st.s+1} sur ${ch.screens.length}">${dots}</span></p>
  <div class="stage">${sc.svg()}${sc.replay?`<button class="replay" id="replay">Revoir</button>`:""}</div>
  <section class="screen"><h2>${sc.t}</h2>${sc.sim?simHTML():""}<p>${sc.p}</p>
  ${sc.checks?`<ul class="checks">${sc.checks.map(([i,x])=>`<li><span class="ic" style="color:var(${i==="✓"?"--ok":"--thread"})">${i}</span><span>${x}</span></li>`).join("")}</ul>`:""}
  ${sc.tip?`<div class="note tip"><span class="ic">💡</span><span>${sc.tip}</span></div>`:""}
  ${sc.warn?`<div class="note warn"><span class="ic">⚠️</span><span>${sc.warn}</span></div>`:""}</section>`;
  const last=st.s===ch.screens.length-1;
  nextB.textContent=last?(st.c===CH.length-1?"J'ai cousu !":"Chapitre suivant"):"C'est fait";
  app.querySelectorAll("[data-sim]").forEach(b=>b.onclick=()=>{st.sim[b.dataset.sim]=b.dataset.v;save();render();});
  const r=$("replay"); if(r) r.onclick=()=>{const p=app.querySelector(".draw");if(!p)return;p.classList.remove("draw");void p.getBoundingClientRect();p.classList.add("draw");};
}

function home(){
  const started=Object.keys(st.done).length>0;
  app.innerHTML=`<section class="hero"><div class="stage">${machine({segs:["top","down","u","take","eye"]})}</div>
  <h1>Ta première couture, sans rien savoir.</h1>
  <p class="lead">Jamais touché une machine à coudre ? Parfait. Pose ton téléphone à côté d'elle : <b>un écran = un geste</b>, avec un schéma à chaque fois.</p>
  <ol class="chapters">${CH.map((c,i)=>`<li class="${st.done[c.key]?"ok":""}"><button data-go="${i}"><b>${st.done[c.key]?"✓":i+1}</b><span>${c.title}<small>${c.time} · ${c.screens.length} gestes</small></span></button></li>`).join("")}</ol></section>`;
  prevB.hidden=true; nextB.textContent=started?"Reprendre":"Commencer";
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{st.c=+b.dataset.go;st.s=-1;save();render();});
}

function end(){
  app.innerHTML=`<section class="screen"><div class="stage">${SVG.lockstitch()}</div>
  <h2>Bravo, tu sais coudre.</h2><p>Maintenant, de la pratique. Coche les exercices dans l'ordre, ils montent en difficulté.</p></section>
  <ol class="todo">${EXOS.map((t,j)=>`<li><button data-i="${j}" aria-pressed="${!!st.exos[j]}"><span class="box">${st.exos[j]?"✓":j+1}</span><span>${t}</span></button></li>`).join("")}</ol>
  <div class="note tip"><span class="ic">🧹</span><span>Tous les 2 ou 3 projets, sors la boîte à canette et enlève les peluches avec un petit pinceau. Change l'aiguille toutes les 8 h de couture environ.</span></div>`;
  prevB.hidden=false; nextB.textContent="Retour au sommaire";
  app.querySelectorAll(".todo button").forEach(b=>b.onclick=()=>{const j=+b.dataset.i;st.exos[j]=!st.exos[j];save();render();});
}

nextB.onclick=()=>{
  if(st.c<0){const i=CH.findIndex(c=>!st.done[c.key]);st.c=i<0?0:i;st.s=-1;}
  else if(st.c>=CH.length){st.c=-1;}
  else{const ch=CH[st.c];
    if(st.s<ch.screens.length-1)st.s++;
    else{st.done[ch.key]=true;st.c++;st.s=-1;}}
  save();render();
};
prevB.onclick=()=>{
  if(st.c>=CH.length){st.c=CH.length-1;st.s=CH[st.c].screens.length-1;}
  else if(st.s>=0)st.s--;
  else if(st.c>0){st.c--;st.s=CH[st.c].screens.length-1;}
  else st.c=-1;
  save();render();
};
$("brand").onclick=()=>{st.c=-1;save();render();};

/* ---------- Feuilles ---------- */
$("faq").innerHTML=FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("");
$("words").innerHTML=WORDS.map(([w,d])=>`<dt>${w}</dt><dd>${d}</dd>`).join("");
const scrim=$("scrim");let openS=null,opener=null;
function openSheet(id,btn){openS=$(id);opener=btn;openS.classList.add("open");scrim.classList.add("open");openS.querySelector(".close").focus();}
function closeSheet(){if(!openS)return;openS.classList.remove("open");scrim.classList.remove("open");opener&&opener.focus();openS=null;}
$("helpBtn").onclick=e=>openSheet("sheetHelp",e.currentTarget);
$("wordsBtn").onclick=e=>openSheet("sheetWords",e.currentTarget);
document.querySelectorAll(".close").forEach(b=>b.onclick=closeSheet);
scrim.onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body></html>
