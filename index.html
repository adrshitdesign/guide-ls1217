<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coudre avec la LS-1217</title>
<meta name="theme-color" content="#E9ECE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Guide pas à pas pour débuter sur la machine à coudre Brother LS-1217.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LS-1217">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE7; --surface:#F8F9F6; --ink:#1D2628; --muted:#5A6669; --line:#CDD3CD;
  --teal:#2E6F73; --teal-soft:#D3E4E2; --thread:#D33B2F; --tape:#EDB425;
  --machine:#FCFCF9; --machine-shade:#E3E6E0; --metal:#AEB6B6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A1B; --surface:#1E2627; --ink:#E9EDE9; --muted:#9BA7A7; --line:#33403F;
    --teal:#68B0B3; --teal-soft:#21393A; --thread:#FF6A5C; --tape:#F3C443;
    --machine:#2A3334; --machine-shade:#222A2B; --metal:#5E6A6A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1B; --surface:#1E2627; --ink:#E9EDE9; --muted:#9BA7A7; --line:#33403F;
  --teal:#68B0B3; --teal-soft:#21393A; --thread:#FF6A5C; --tape:#F3C443;
  --machine:#2A3334; --machine-shade:#222A2B; --metal:#5E6A6A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,.display{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding:12px 18px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;white-space:nowrap}
.stitches{flex:1;display:flex;align-items:center;gap:0;min-width:0}
.stitches i{flex:1;height:3px;margin:0 2px;border-radius:2px;background:var(--line);transition:background .3s}
.stitches i.done{background:var(--thread)}
.stitches i.now{background:var(--ink)}
.help{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}

main{max-width:560px;margin:0 auto;padding:0 18px 120px}

/* intro */
.intro h1{font-size:clamp(40px,11vw,62px);line-height:.95;font-weight:800;margin:18px 0 14px}
.intro p.lead{font-size:19px;color:var(--muted);margin:0 0 22px;max-width:30ch}
.route{list-style:none;padding:0;margin:26px 0 0;position:relative}
.route::before{content:"";position:absolute;left:15px;top:12px;bottom:12px;border-left:3px dashed var(--thread)}
.route li{position:relative;display:flex;gap:14px;align-items:center;padding:8px 0}
.route b{flex:none;width:33px;height:33px;border-radius:50%;background:var(--surface);border:3px solid var(--thread);
  display:grid;place-items:center;font-size:14px;z-index:1}
.route li.ok b{background:var(--thread);color:#fff}
.route span{font-weight:700}
.route small{display:block;color:var(--muted);font-weight:400;font-size:14px}

/* step */
.stage{background:var(--surface);border-radius:22px;margin-top:6px;padding:14px 10px 6px;position:relative;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.replay{position:absolute;right:12px;bottom:10px;border:0;background:var(--thread);color:#fff;border-radius:999px;
  padding:6px 14px;font-size:14px;font-weight:700}
.replay[hidden]{display:none}
.kicker{margin:22px 0 2px;color:var(--teal);font-weight:700;font-size:15px}
.step h2{font-size:clamp(30px,8vw,40px);line-height:1;margin:0 0 8px;font-weight:800}
.why{color:var(--muted);margin:0 0 18px}

.todo{list-style:none;margin:0;padding:0;counter-reset:t}
.todo li{margin:0 0 8px}
.todo button{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;
  background:var(--surface);border:2px solid transparent;border-radius:16px;padding:13px 14px;transition:border-color .2s,opacity .2s}
.todo button .box{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;
  font-weight:700;font-size:14px;margin-top:-1px}
.todo button[aria-pressed="true"]{opacity:.55}
.todo button[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:#fff}
.todo button[aria-pressed="true"] .txt{text-decoration:line-through;text-decoration-color:var(--teal);text-decoration-thickness:2px}
.todo strong{font-weight:700}

.note{margin:16px 0 0;padding:14px 16px;border-radius:16px;display:flex;gap:12px}
.note.tip{background:var(--teal-soft)}
.note.warn{background:color-mix(in srgb,var(--tape) 28%,var(--surface))}
.note .ic{flex:none;font-size:20px;line-height:1.2}

/* settings simulator */
.sim{background:var(--surface);border-radius:18px;padding:16px;margin:0 0 14px}
.sim h3{margin:0 0 4px;font-size:16px}
.sim .row{margin:0 0 14px}
.sim .row:last-of-type{margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sim .hint{font-size:14px;color:var(--muted)}
.sim .status{font-weight:700;padding:10px 12px;border-radius:12px;background:var(--bg)}
.sim .status.ok{background:var(--teal);color:#fff}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav button{height:54px;border-radius:16px;font-weight:700;font-size:17px;border:0}
.prev{flex:0 0 auto;padding:0 18px;background:var(--surface)!important}
.next{flex:1;background:var(--ink);color:var(--surface)}
.next.ready{background:var(--thread);color:#fff}
.prev[hidden]{display:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;
  max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .3s ease;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:30px;margin:0 0 4px}
.sheet .lead{color:var(--muted);margin:0 0 14px}
.reflex{background:var(--thread);color:#fff;border-radius:16px;padding:14px 16px;margin:0 0 16px;font-weight:700}
.reflex span{display:block;font-weight:400;opacity:.9}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;padding:14px 0;font-weight:700;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--teal)}
details[open] summary::after{content:"–"}
details p{margin:0 0 14px;color:var(--muted)}
details p b{color:var(--ink)}
.close{width:100%;margin-top:18px;height:50px;border-radius:14px;border:0;background:var(--ink);color:var(--surface);font-weight:700}

/* svg machine */
.m-body{fill:var(--machine);stroke:var(--ink);stroke-width:2}
.m-shade{fill:var(--machine-shade)}
.m-metal{fill:var(--metal);stroke:var(--ink);stroke-width:1.5}
.m-teal{fill:var(--teal)}
.m-line{stroke:var(--ink);stroke-width:2;fill:none}
.m-thin{stroke:var(--ink);stroke-width:1.2;fill:none}
.m-dial{fill:var(--machine);stroke:var(--ink);stroke-width:2}
.m-label{font:700 9px "Atkinson Hyperlegible",sans-serif;fill:var(--muted)}
.thread{fill:none;stroke:var(--thread);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.thread.on{opacity:1}
.thread.draw{animation:draw 3.2s ease-in-out forwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mark{opacity:0;transition:opacity .3s}
.mark.on{opacity:1}
.mark circle.ring{fill:none;stroke:var(--tape);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
.mark circle.dot{fill:var(--tape);stroke:var(--ink);stroke-width:1.5}
.mark text{font:700 11px "Atkinson Hyperlegible",sans-serif;fill:#1D2628;text-anchor:middle;dominant-baseline:central}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.9);opacity:0}}

.detail{display:block;margin:0 auto;width:100%;max-width:300px}
.done-hero{text-align:center;padding:10px 0}
.done-hero h2{font-size:44px}

@media (prefers-reduced-motion:reduce){
  .mark circle.ring{animation:none;opacity:.7}
  .thread.draw{animation:none;stroke-dashoffset:0}
  .sheet,.scrim{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">LS-1217</div>
  <div class="stitches" id="bar" aria-hidden="true"></div>
  <button class="help" id="helpBtn" aria-haspopup="dialog">Ça coince ?</button>
</header>

<main id="app" aria-live="polite"></main>

<nav class="nav">
  <div class="in">
    <button class="prev" id="prev">Retour</button>
    <button class="next" id="next">Commencer</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="in">
    <h2 id="sheetTitle" class="display">Ça coince ?</h2>
    <p class="lead">Choisis ce qui se passe, la solution est dessous.</p>
    <div class="reflex">Le réflexe qui règle la moitié des soucis
      <span>Tout désenfiler, lever le pied presseur, tout réenfiler.</span></div>
    <div id="faq"></div>
    <button class="close" id="closeSheet">Revenir à mon étape</button>

</section>

  <defs>

      <path class="m-body" d="M44 46 Q44 34 58 34 H318 Q334 34 334 50 V92 H112 V150 Q112 160 102 160 H54 Q44 160 44 150 Z"/>
      <!-- teal stripe -->

      <!-- logo -->

      <!-- head channels -->
      <line class="m-thin" x1="78" y1="48" x2="78" y2="142"/>
      <line class="m-thin" x1="96" y1="48" x2="96" y2="142"/>

      <circle cx="260" cy="22" r="6" fill="var(--machine)" stroke="var(--ink)" stroke-width="1.5"/>
      <!-- top thread guide & winder tension -->
      <rect class="m-metal" x="110" y="28" width="12" height="6" rx="2"/>
      <circle cx="222" cy="30" r="4" class="m-metal"/>
      <!-- front controls: L M R lever -->
      <rect class="m-thin" x="130" y="102" width="20" height="22" rx="3"/>
      <rect x="134" y="108" width="12" height="12" rx="2" fill="var(--machine-shade)" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="122" y="108" class="m-label">L</text><text x="120" y="117" class="m-label">M</text><text x="122" y="126" class="m-label">R</text>
      <!-- dials -->
      <circle class="m-dial" cx="256" cy="120" r="15"/>
      <circle class="m-thin" cx="256" cy="120" r="9"/>
      <text x="256" y="146" class="m-label" text-anchor="middle">largeur</text>
      <circle class="m-dial" cx="304" cy="120" r="15"/>
      <circle class="m-thin" cx="304" cy="120" r="9"/>
      <text x="304" y="146" class="m-label" text-anchor="middle">longueur</text>
      <!-- reverse lever -->
      <rect x="292" y="152" width="22" height="14" rx="3" fill="var(--machine-shade)" stroke="var(--ink)" stroke-width="1.5"/>
      <!-- handwheel -->
      <rect x="334" y="62" width="14" height="70" rx="6" fill="var(--machine-shade)" stroke="var(--ink)" stroke-width="2"/>
      <line class="m-thin" x1="338" y1="70" x2="338" y2="124"/>
      <line class="m-thin" x1="344" y1="70" x2="344" y2="124"/>

<script>
const MARKS = {
  lever:{x:140,y:96,n:"1"}, width:{x:256,y:98,n:"2"}, length:{x:304,y:98,n:"3"}, reverse:{x:322,y:159,n:"4"},
  wheel:{x:341,y:56,n:"5"}, foot:{x:118,y:136,n:"6"},
  spool:{x:296,y:4,n:"1"}, winder:{x:260,y:10,n:"2"}, guide:{x:222,y:18,n:"↺"},
  door:{x:62,y:193,n:"1"}, needle:{x:52,y:168,n:"!"}, plate:{x:80,y:186,n:"↑"}, power:{x:345,y:194,n:"⏻"}
};

const THREADS = {
  top:"M296 30 L296 36 L116 36 L98 44 L98 134 Q98 146 87 146 Q76 146 76 134 L76 56 L72 60 L72 150 L69 158 L69 172",
  bobbin:"M296 30 L296 38 L222 34 L240 26 L254 22",
  pull:"M74 186 Q60 176 70 172 M69 168 L69 176 M70 174 Q96 172 128 168"
};

const STEPS = [
  { key:"reglages", label:"Les réglages", sub:"Ce que font les boutons",
    title:"Les 6 commandes à connaître",
    why:"Pas d'écran, tout se règle à la main. Joue avec le simulateur jusqu'au réglage de base.",
    marks:["lever","width","length","reverse","wheel","foot"], sim:true,
    items:[
      "<strong>1 · Levier L/M/R</strong> : place l'aiguille à gauche, au milieu ou à droite.",
      "<strong>2 · Molette largeur</strong> : 0 = point droit, plus haut = zigzag plus large.",
      "<strong>3 · Molette longueur</strong> : taille du point. 2,5 = normal.",
      "<strong>4 · Levier carré</strong> : maintenu, la machine coud en marche arrière.",
      "<strong>5 · Volant</strong> : fait monter l'aiguille à la main. Toujours vers toi.",
      "<strong>6 · Levier du pied</strong> : derrière l'aiguille, lève et baisse le pied."
    ],
    tip:"Le volant se tourne toujours vers toi. Dans l'autre sens, le fil s'emmêle sous la plaque."
  },
  { key:"prep", label:"Préparer", sub:"Aiguille, fil, sécurité",
    title:"On prépare le terrain",
    why:"Deux minutes de vérification évitent 90 % des galères.",
    marks:["needle","power"],
    items:[
      "Branche la pédale mais <strong>laisse la machine sur OFF</strong> pendant l'enfilage.",
      "Aiguille <strong>droite et bien enfoncée</strong>, côté plat vers l'arrière. Au moindre doute, change-la (universelle 80 ou 90).",
      "Prends un <strong>fil polyester</strong> correct. Le fil premier prix casse.",
      "Pour t'entraîner : un vieux drap ou du coton épais. Pas de t-shirt."
    ],
    warn:"Avant chaque geste près de l'aiguille : remonte-la tout en haut avec le volant."
  },
  { key:"bobinage", label:"Remplir la canette", sub:"Le fil du dessous",
    title:"Remplir la canette",
    why:"Une machine coud avec deux fils : celui de la bobine en haut, celui de la canette en bas. On commence par remplir la canette.",
    marks:["spool","winder","guide"], thread:"bobbin",
    items:[
      "Pose ta bobine sur la <strong>tige du dessus</strong> (1).",
      "Tire le fil vers la gauche et fais le tour du <strong>petit disque</strong> (↺).",
      "Passe le bout dans un trou de la canette, <strong>de l'intérieur vers l'extérieur</strong>.",
      "Enfonce la canette sur l'axe (2) et <strong>pousse-la à droite</strong> jusqu'au clic.",

  { key:"canette", label:"Placer la canette", sub:"Sous l'aiguille",

    items:[

  { key:"enfilage", label:"Enfiler le haut", sub:"Le trajet du fil",

    tip:"Pas de boucle ? La canette est mal posée ou le fil du haut a sauté un passage."
  },
  { key:"couture", label:"Première couture", sub:"Enfin",
    title:"Ta première couture",
    why:"Réglage de base : aiguille M, largeur 0, longueur 2,5. Deux chutes de tissu l'une sur l'autre.",
    marks:["reverse","wheel","foot"],
    items:[
      "Bord du tissu sur le repère <strong>1,5 cm</strong> gravé sur la plaque.",
      "Tourne le volant pour piquer l'aiguille, puis <strong>baisse le pied</strong>.",
      "Allume. Pédale <strong>doucement</strong> : 4 ou 5 points.",
      "<strong>Point d'arrêt</strong> : maintiens le levier carré (4), 4 points en arrière, relâche.",
      "Couds droit. Tes mains <strong>guident</strong>, elles ne tirent pas.",
      "À la fin : nouveau point d'arrêt, aiguille en haut, pied levé, coupe à 10 cm."
    ],
    tip:"Pour tourner un angle : aiguille plantée dans le tissu, lève le pied, pivote, rebaisse."
  }
];

const FAQ = [
  ["Un paquet de fil sous le tissu","Le fil du haut a été enfilé <b>pied baissé</b>. Lève le pied et réenfile tout le haut."],
  ["Le fil du haut casse","Enfilage raté ou aiguille abîmée. <b>Réenfile</b>, puis <b>change l'aiguille</b> (côté plat à l'arrière)."],
  ["Des points sautent","Aiguille émoussée ou tordue : <b>change-la</b>."],
  ["L'aiguille casse","Tu tires le tissu, ou elle tape une épingle. <b>Laisse la machine avancer</b> et retire les épingles avant le pied."],
  ["Le tissu n'avance pas","Pied pas baissé, ou longueur sur 0. <b>Baisse le pied</b>, longueur sur <b>2,5</b>."],
  ["La couture fronce","Points trop longs sur tissu fin. Passe la longueur à <b>2</b> et teste sur une chute."],
  ["Le volant tourne, l'aiguille non","L'axe de bobinage est resté <b>poussé à droite</b>. Repousse-le à gauche."],
  ["Ça claque ou ça bloque","Fil coincé sous la plaque. <b>OFF</b>, sors la canette, retire les bouts de fil et les peluches."]
];

const EXOS = [
  "Coudre sur du papier sans fil, en suivant des lignes au crayon",
  "Même chose avec des courbes",
  "Une ligne droite de 30 cm sur tissu, avec points d'arrêt",
  "Un carré en pivotant aux 4 angles",
  "Du zigzag (largeur 3 à 5) le long d'un bord coupé",
  "Premier projet : une taie d'oreiller ou un tote bag"
];

let state = {step:-1, checks:{}, sim:{lever:"L", width:"3", length:"4"}};
try{ const s = JSON.parse(localStorage.getItem("ls1217")||"null"); if(s) state = Object.assign(state,s); }catch(e){}
function save(){ try{ localStorage.setItem("ls1217", JSON.stringify(state)); }catch(e){} }

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const TOTAL = STEPS.length;

function stepDone(i){
  const s = STEPS[i]; const c = state.checks[s.key]||[];
  return s.items.every((_,j)=>c[j]);
}

function renderBar(){
  bar.innerHTML = STEPS.map((_,i)=>{
    let cls = stepDone(i) ? "done" : (i===state.step ? "now" : "");
    return `<i class="${cls}"></i>`;
  }).join("");
}

function machineSVG(s){
  const marks = Object.entries(MARKS).map(([k,m])=>{
    const on = s && s.marks && s.marks.includes(k);
    return `<g class="mark ${on?"on":""}"><circle class="ring" cx="${m.x}" cy="${m.y}" r="9"/><circle class="dot" cx="${m.x}" cy="${m.y}" r="9"/><text x="${m.x}" y="${m.y+0.5}">${m.n}</text></g>`;
  }).join("");
  const threads = Object.entries(THREADS).map(([k,d])=>{
    const on = s && s.thread===k;
    return `<path class="thread ${on?"on draw":""}" data-t="${k}" d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${on?1:0}"/>`;
  }).join("");
  return `<svg viewBox="0 -6 360 236" role="img" aria-label="Schéma de la machine Brother LS-1217">
    <use href="#machine"/>${threads}${marks}</svg>`;
}

function bobbinDetail(){
  return `<svg class="detail" viewBox="0 0 220 150" role="img" aria-label="Canette dans sa boîte, fil vers la droite, sens des aiguilles d'une montre">
    <circle cx="90" cy="75" r="56" fill="var(--metal)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="90" cy="75" r="40" fill="var(--machine)" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="90" cy="75" r="30" fill="var(--thread)" opacity=".85"/>
    <circle cx="90" cy="75" r="9" fill="var(--machine)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M90 22 h10 v-12 h-20 v12 z" fill="var(--metal)" stroke="var(--ink)" stroke-width="2"/>
    <path d="M118 52 A36 36 0 0 1 124 98" fill="none" stroke="var(--ink)" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M120 75 Q150 70 200 60" fill="none" stroke="var(--thread)" stroke-width="3.5" stroke-linecap="round"/>
    <text x="150" y="100" style="font:700 12px 'Atkinson Hyperlegible',sans-serif;fill:var(--ink)">sens horaire</text>
    <defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker></defs>
  </svg>`;
}

function simHTML(){
  const sim = state.sim;
  const seg = (key, vals) => `<div class="seg" role="group">${vals.map(v=>`<button data-sim="${key}" data-v="${v}" aria-pressed="${sim[key]===v}">${v.replace(".",",")}</button>`).join("")}</div>`;
  const ok = sim.lever==="M" && sim.width==="0" && sim.length==="2.5";
  return `<div class="sim">
    <h3>Simulateur : trouve le réglage de base</h3>
    <div class="row"><span class="hint">Position de l'aiguille</span>${seg("lever",["L","M","R"])}</div>
    <div class="row"><span class="hint">Largeur</span>${seg("width",["0","1","2","3","4","5"])}</div>
    <div class="row"><span class="hint">Longueur</span>${seg("length",["0","1","2","2.5","3","4"])}</div>
    <div class="status ${ok?"ok":""}">${ok ? "Point droit classique. C'est le réglage de 80 % de tes coutures." : simHint(sim)}</div>
  </div>`;
}
function simHint(s){
  if(s.width!=="0") return `Largeur ${s.width} = zigzag. Pour coudre droit, mets la largeur à 0.`;
  if(s.lever!=="M") return `Aiguille à ${s.lever==="L"?"gauche":"droite"}. Centre-la sur M.`;
  if(s.length==="0") return "Longueur 0 = la machine pique sur place sans avancer.";
  return `Longueur ${s.length.replace(".",",")} : vise 2,5, le point standard.`;
}

function render(){
  renderBar();
  window.scrollTo(0,0);
  if(state.step<0){ renderIntro(); return; }
  if(state.step>=TOTAL){ renderEnd(); return; }
  const s = STEPS[state.step];
  const c = state.checks[s.key] || [];
  app.innerHTML = `
    <div class="stage">${machineSVG(s)}
      <button class="replay" id="replay" ${s.thread?"":"hidden"}>Revoir le trajet</button></div>
    ${s.detail ? `<div class="stage" style="margin-top:10px">${bobbinDetail()}</div>` : ""}
    <section class="step">
      <p class="kicker">Étape ${state.step+1} sur ${TOTAL}</p>
      <h2>${s.title}</h2>
      <p class="why">${s.why}</p>
      ${s.sim ? simHTML() : ""}
      <ol class="todo">${s.items.map((t,j)=>`<li><button data-i="${j}" aria-pressed="${!!c[j]}"><span class="box">${c[j]?"✓":j+1}</span><span class="txt">${t}</span></button></li>`).join("")}</ol>
      ${s.tip ? `<div class="note tip"><span class="ic">💡</span><span>${s.tip}</span></div>`:""}
      ${s.warn ? `<div class="note warn"><span class="ic">⚠️</span><span>${s.warn}</span></div>`:""}
    </section>`;
  prevBtn.hidden = false;
  nextBtn.textContent = state.step===TOTAL-1 ? "J'ai cousu !" : "Étape suivante";
  nextBtn.classList.toggle("ready", stepDone(state.step));

  app.querySelectorAll(".todo button").forEach(b=>b.addEventListener("click",()=>{
    const j = +b.dataset.i; const arr = state.checks[s.key] = state.checks[s.key]||[];
    arr[j] = !arr[j]; save();
    b.setAttribute("aria-pressed", !!arr[j]);
    b.querySelector(".box").textContent = arr[j] ? "✓" : j+1;
    nextBtn.classList.toggle("ready", stepDone(state.step));
    renderBar();
  }));
  app.querySelectorAll("[data-sim]").forEach(b=>b.addEventListener("click",()=>{
    state.sim[b.dataset.sim] = b.dataset.v; save();
    app.querySelector(".sim").outerHTML = simHTML();
    render();
  }));
  const rp = document.getElementById("replay");
  if(rp) rp.addEventListener("click",()=>{
    const p = app.querySelector(".thread.on"); if(!p) return;
    p.classList.remove("draw"); void p.getBoundingClientRect(); p.classList.add("draw");
  });
}

function renderIntro(){
  app.innerHTML = `
    <section class="intro">
      <div class="stage">${machineSVG({thread:"top",marks:[]})}</div>
      <h1>De zéro à ta première couture.</h1>
      <p class="lead">Pose ton téléphone à côté de la machine. Une étape à la fois, tu coches au fur et à mesure.</p>
      <ol class="route">${STEPS.map((s,i)=>`<li class="${stepDone(i)?"ok":""}"><b>${stepDone(i)?"✓":i+1}</b><span>${s.label}<small>${s.sub}</small></span></li>`).join("")}</ol>
    </section>`;
  prevBtn.hidden = true;
  const any = STEPS.some((_,i)=>stepDone(i));
  nextBtn.textContent = any ? "Reprendre" : "Commencer";
  nextBtn.classList.add("ready");
}

function renderEnd(){
  const c = state.checks.exos||[];
  app.innerHTML = `
    <section class="done-hero">
      <div class="stage">${machineSVG({thread:"top",marks:[]})}</div>
      <h2 class="display">Ta machine n'a plus de secret.</h2>
      <p class="why">Maintenant, de la pratique. Coche les exercices dans l'ordre.</p>
    </section>
    <ol class="todo">${EXOS.map((t,j)=>`<li><button data-i="${j}" aria-pressed="${!!c[j]}"><span class="box">${c[j]?"✓":j+1}</span><span class="txt">${t}</span></button></li>`).join("")}</ol>
    <div class="note tip"><span class="ic">🧹</span><span>Tous les 2 ou 3 projets, sors la boîte à canette et enlève les peluches avec un petit pinceau. Change l'aiguille toutes les 8 h de couture environ.</span></div>`;
  prevBtn.hidden = false;
  nextBtn.textContent = "Revoir le parcours";
  nextBtn.classList.remove("ready");
  app.querySelectorAll(".todo button").forEach(b=>b.addEventListener("click",()=>{
    const j=+b.dataset.i; const arr = state.checks.exos = state.checks.exos||[];
    arr[j]=!arr[j]; save(); b.setAttribute("aria-pressed",!!arr[j]); b.querySelector(".box").textContent = arr[j]?"✓":j+1;
  }));
}

nextBtn.addEventListener("click",()=>{
  if(state.step<0){
    const firstOpen = STEPS.findIndex((_,i)=>!stepDone(i));
    state.step = firstOpen<0 ? 0 : firstOpen;
  } else if(state.step>=TOTAL){ state.step=-1; }
  else state.step++;
  save(); render();
});
prevBtn.addEventListener("click",()=>{ state.step = state.step>=TOTAL ? TOTAL-1 : state.step-1; save(); render(); });

/* sheet */
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
document.getElementById("faq").innerHTML = FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("");
function openSheet(){ sheet.classList.add("open"); scrim.classList.add("open"); document.getElementById("closeSheet").focus(); }
function closeSheet(){ sheet.classList.remove("open"); scrim.classList.remove("open"); document.getElementById("helpBtn").focus(); }
document.getElementById("helpBtn").addEventListener("click",openSheet);
document.getElementById("closeSheet").addEventListener("click",closeSheet);
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheet.classList.contains("open")) closeSheet(); });

render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
